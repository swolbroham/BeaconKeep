services:
  db:
    image: postgres:17
    container_name: beaconkeep-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: beaconkeep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: beaconkeep

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beaconkeep -d beaconkeep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: